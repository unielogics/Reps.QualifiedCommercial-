<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Field Desk Training Capture</title>
  <style>
    :root { --ink:#111924; --muted:#657184; --line:#dce2ea; --bg:#f3f6fa; --surface:#fff; --blue:#2454a6; --blue2:#eaf1fc; --green:#147a53; --green2:#e9f6ef; --amber:#a86400; --amber2:#fff4dd; --red:#b42318; --red2:#fff0ef; }
    * { box-sizing:border-box; }
    html { min-width:1380px; overflow:hidden; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 Arial,Helvetica,sans-serif; }
    body { width:1380px; min-width:0; min-height:1125px; overflow:hidden; }
    button,input,select,textarea { font:inherit; }
    .app { width:1380px; min-height:1125px; display:grid; grid-template-columns:210px minmax(0,1fr); }
    .side { position:relative; padding:18px 12px; background:#fff; border-right:1px solid var(--line); }
    .brand { display:flex; gap:10px; align-items:center; margin:0 4px 24px; }
    .brand img { width:38px; height:38px; }
    .brand b,.brand span { display:block; }
    .brand span { color:#536078; font-size:10px; text-transform:uppercase; letter-spacing:.14em; }
    .nav { display:grid; gap:5px; }
    .nav div { min-height:46px; display:flex; align-items:center; gap:11px; border-radius:7px; padding:0 12px; color:#334155; }
    .nav .on { background:#eaf1fc; color:#174996; font-weight:700; }
    .nav i { width:20px; text-align:center; font-style:normal; }
    .user { position:absolute; left:12px; right:12px; bottom:14px; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
    .user b,.user span { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .user span { color:var(--muted); font-size:11px; }
    .main { min-width:0; }
    .top { height:67px; display:flex; align-items:center; gap:12px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); }
    .top b { font-size:13px; }
    .top .crumb { color:var(--muted); }
    .sp { flex:1; }
    .search { width:300px; border:1px solid var(--line); border-radius:8px; padding:11px 14px; color:#8993a3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .content { padding:20px 18px 38px; }
    h1 { margin:0; font-size:25px; letter-spacing:-.02em; }
    h2 { margin:0; font-size:18px; }
    h3 { margin:0; font-size:15px; }
    p { margin:0; }
    .sub { color:var(--muted); }
    .eyebrow { color:#335aa4; font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:.14em; }
    .row { display:flex; align-items:center; gap:10px; }
    .stack { display:grid; gap:14px; }
    .step5Compact { zoom:.92; }
    .panel { border:1px solid var(--line); border-radius:9px; background:#fff; overflow:hidden; }
    .panel-h { min-height:48px; display:flex; align-items:center; gap:9px; padding:0 15px; border-bottom:1px solid var(--line); font-weight:700; }
    .panel-b { padding:15px; }
    .btn { min-height:42px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#253247; padding:0 16px; font-weight:700; }
    .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn.danger { color:var(--red); }
    .iconbtn { width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:20px; }
    .chip { display:inline-flex; align-items:center; min-height:25px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; background:#edf1f5; color:#536078; }
    .chip.green { background:var(--green2); color:var(--green); }
    .chip.amber { background:var(--amber2); color:var(--amber); }
    .chip.red { background:var(--red2); color:var(--red); }
    .field { min-height:45px; border:1px solid #ccd5e1; border-radius:8px; background:#fff; padding:11px 12px; color:#253247; }
    .field.invalid { border-color:#d24b42; background:#fff7f6; }
    .label { display:block; margin-bottom:6px; color:#5f6b7f; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
    .fieldgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .fieldgrid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .notice { border:1px solid #adddd3; border-radius:8px; background:#ebf8f5; color:#285e55; padding:12px 14px; }
    .warning { border:1px solid #ecd18a; border-radius:8px; background:#fff8e8; color:#705516; padding:12px 14px; }
    .dangerbox { border:1px solid #ebb4ae; border-radius:8px; background:#fff4f3; color:#82372f; padding:12px 14px; }
    .table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:11.5px; }
    .table th { padding:8px; background:#f7f9fc; border-bottom:1px solid var(--line); text-align:left; color:#657184; font-size:9px; text-transform:uppercase; letter-spacing:.06em; }
    .table td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
    .table tr:last-child td { border-bottom:0; }
    .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .kpi { border:1px solid var(--line); border-radius:8px; background:#fff; padding:14px; }
    .kpi small,.kpi strong { display:block; }
    .kpi small { color:#657184; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .kpi strong { margin-top:8px; font-size:25px; }
    .meter { height:9px; border-radius:99px; overflow:hidden; background:#edf1f5; }
    .meter span { display:block; height:100%; background:var(--blue); }
    .application { display:grid; grid-template-columns:210px minmax(0,1fr) 225px; gap:12px; align-items:start; }
    .rail { display:grid; gap:7px; }
    .rung { display:flex; gap:10px; min-height:68px; padding:11px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .rung.on { border-color:#6c8fd1; background:#edf3fd; }
    .rung.off { opacity:.48; }
    .num { width:26px; height:26px; display:grid; place-items:center; flex:0 0 auto; border-radius:8px; background:#edf1f5; font-weight:800; }
    .rung.on .num { color:#fff; background:var(--blue); }
    .rung b,.rung span { display:block; }
    .rung span { margin-top:3px; color:var(--muted); font-size:11px; }
    .sidepanel { display:grid; gap:12px; }
    .conversation { min-height:180px; }
    .bubble { margin:8px 0; border-radius:12px; background:#f2f4f7; padding:10px 12px; }
    .bubble.me { margin-left:34px; background:#eaf1fc; }
    .footerAction { position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:13px 15px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.96); box-shadow:0 -5px 20px rgba(18,34,55,.08); }
    .workspace { position:absolute; inset:0 auto auto 210px; width:1170px; height:1125px; z-index:5; background:var(--bg); }
    .workspaceHead { height:68px; display:flex; align-items:center; gap:10px; padding:0 22px; background:#fff; border-bottom:1px solid var(--line); }
    .workspaceBody { height:1057px; overflow:auto; padding:20px 24px; }
    .newgrid { display:grid; grid-template-columns:220px minmax(0,1fr); gap:14px; }
    .formcols { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(245px,.7fr); gap:12px; }
    .modalShade { position:absolute; inset:0 auto auto 0; width:1380px; height:1125px; z-index:20; display:grid; place-items:center; padding:32px; background:rgba(17,25,36,.48); }
    .modal { width:min(760px,calc(100vw - 64px)); max-height:calc(100vh - 64px); overflow:auto; border-radius:10px; background:#fff; box-shadow:0 18px 55px rgba(0,0,0,.24); }
    .modal .panel-h { position:sticky; top:0; background:#fff; z-index:2; }
    .slotgrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .slot { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fff; }
    .slot.selected { border-color:#d6a72c; background:#fff8e8; }
    .docrow { display:grid; grid-template-columns:36px 1fr auto; gap:12px; align-items:center; padding:12px; border-bottom:1px solid var(--line); }
    .docrow:last-child { border-bottom:0; }
    .docicon { width:34px; height:34px; display:grid; place-items:center; border-radius:8px; background:#edf3fd; color:#2454a6; }
    .timeline { display:grid; gap:0; }
    .event { position:relative; padding:0 0 18px 31px; }
    .event:before { content:""; position:absolute; left:8px; top:7px; bottom:-3px; width:1px; background:#dce2ea; }
    .event:last-child:before { display:none; }
    .event:after { content:""; position:absolute; left:3px; top:5px; width:11px; height:11px; border-radius:50%; background:#2454a6; }
    .screenTitle { display:flex; align-items:flex-end; gap:12px; margin-bottom:18px; }
    .screenTitle .sub { padding-bottom:2px; }
    .agreementCapture { position:absolute; inset:0 auto auto 0; width:1380px; height:1125px; z-index:40; display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:#eef2f7; }
    .agreementCaptureHead { min-height:78px; display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--line); background:#fff; }
    .agreementCaptureIdentity { min-width:0; display:flex; align-items:center; gap:12px; }
    .agreementCaptureIdentity > div { display:grid; gap:2px; }
    .agreementCaptureIdentity small { color:var(--muted); }
    .agreementCaptureActions { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .agreementCaptureStage { min-height:0; overflow:hidden; padding:14px 26px; }
    .pdfWindow { width:min(960px,100%); height:100%; margin:auto; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:#8f98a5; box-shadow:0 10px 30px rgba(18,34,55,.14); padding:22px 64px; }
    .pdfPage { min-height:820px; padding:42px 54px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.2); }
    .pdfPage h2 { text-align:center; margin-bottom:8px; }
    .pdfPage h3 { margin:22px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
    .pdfPage p { margin:7px 0; color:#344054; font:12px/1.55 Georgia,serif; }
    .pdfMeta { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px 0; }
    .pdfMeta div { border:1px solid #d8dde6; padding:9px; font-size:11px; }
    .agreementCaptureFoot { min-height:74px; display:flex; align-items:center; gap:16px; padding:10px 24px; border-top:1px solid var(--line); background:#fff; }
    .agreementCaptureFoot > div { display:grid; gap:2px; }
    .agreementCaptureFoot small { color:var(--muted); }
    .eligList { display:grid; gap:9px; }
    .eligQ { min-height:62px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
    .eligQ b,.eligQ span { display:block; }
    .eligQ span { margin-top:3px; color:var(--muted); font-size:11px; }
    .yn { display:grid; grid-template-columns:repeat(2,68px); gap:6px; }
    .yn button { min-height:42px; border:1px solid var(--line); border-radius:7px; background:#fff; font-weight:800; }
    .yn button.on { border-color:var(--blue); background:var(--blue); color:#fff; }
  </style>
</head>
<body><div id="root"></div>
<script>
  const nav = ["Portfolio","Contacts","Products","Inbox","Calendar","Production","Settings"];
  const stepNames = ["Applicant intake","Verification","Financial profile","Underwriting package","Desk review and execution"];
  const q = new URLSearchParams(location.search);
  const view = q.get("view") || "portfolio";
  const panel = (title, body, right="") => `<section class="panel"><div class="panel-h">${title}<span class="sp"></span>${right}</div><div class="panel-b">${body}</div></section>`;
  const field = (label,value,cls="") => `<label><span class="label">${label}</span><div class="field ${cls}">${value}</div></label>`;
  const shell = (content, active="Portfolio") => `<div class="app"><aside class="side"><div class="brand"><img src="../../public/qc-icon.svg"><div><b>Field Desk</b><span>Qualified Commercial</span></div></div><div class="nav">${nav.map((n,i)=>`<div class="${n===active?'on':''}"><i>${["⌂","◎","▣","◌","□","▥","⚙"][i]}</i>${n}</div>`).join("")}</div><div class="user"><b>Alex Morgan</b><span>Field representative</span></div></aside><main class="main"><header class="top"><b>Field Desk · team view</b><span class="crumb">/ ${active}</span><span class="sp"></span><div class="search">⌕ Search names, emails, addresses, businesses…</div><b>Wed, Aug 26&nbsp;&nbsp;2:01 PM</b><button class="iconbtn">+</button></header><div class="content">${content}</div></main></div>`;
  const rail = (current, unlocked=true) => `<div class="stack">${panel(`<span class="eyebrow">Application sequence</span>`,`<div class="rail">${stepNames.map((name,i)=>`<div class="rung ${i+1===current?'on':''} ${!unlocked&&i>=2?'off':''}"><span class="num">${i+1}</span><div><b>${name}</b><span>${["Entity, owners, request","Bank and owner credit","Verified metrics and capacity","Route package and signature","Summary, decision, handoff"][i]}</span></div></div>`).join("")}</div>`)}</div>`;
  const conversation = () => `<aside class="sidepanel">${panel("Desk conversation",`<div class="conversation"><p class="sub">Internal underwriting notes stay with this file.</p><div class="bubble">Please confirm the primary operating account.</div><div class="bubble me">Client confirmed First National ending 4821.</div></div><div class="field">Write an internal note…</div>`)}</aside>`;
  const appScreen = (current, center, unlocked=true) => shell(`<div class="application">${rail(current,unlocked)}<section class="stack ${current === 5 ? "step5Compact" : ""}">${center}</section>${conversation()}</div>`,"Portfolio");
  const ownerTable = `<table class="table"><thead><tr><th>First name</th><th>Last name</th><th>Ownership</th><th>Personal email</th><th>Personal phone</th><th>Eligibility</th></tr></thead><tbody><tr><td>Jordan</td><td>Alvarez</td><td>70%</td><td>jordan@example.com</td><td>(555) 010-2288</td><td><span class="chip green">Complete</span></td></tr><tr><td>Sam</td><td>Alvarez</td><td>30%</td><td>sam@example.com</td><td>(555) 010-2940</td><td><span class="chip green">Complete</span></td></tr></tbody></table>`;
  const screens = {};
  screens.portfolio = shell(`<div class="screenTitle"><div><span class="eyebrow">Field Desk portfolio</span><h1>Applications</h1></div><p class="sub">Search, verify, and manage every active funding file.</p><span class="sp"></span><button class="btn primary">Open new application</button></div><div class="row" style="margin-bottom:14px"><button class="btn primary">Applications</button><button class="btn">Drafts</button><div class="field" style="flex:1">Search business, owner, email, or address</div><button class="btn">All stages</button><button class="btn">Updated newest ↓</button></div>${panel("Application portfolio",`<table class="table"><thead><tr><th>Applicant</th><th>Owners</th><th>Where</th><th>Stage</th><th>Bank</th><th>Credit</th><th>Requested</th><th>Updated</th><th></th></tr></thead><tbody><tr><td><b>Alvarez Auto Group</b><br><span class="sub">QC-2026-00118</span></td><td>Jordan Alvarez, Sam Alvarez</td><td>Newark, NJ</td><td><span class="chip amber">Verification</span></td><td><span class="chip green">Linked</span></td><td><span class="chip amber">1 of 2</span></td><td>$350,000</td><td>Aug 26</td><td>×</td></tr><tr><td><b>Lakeview Manufacturing</b><br><span class="sub">QC-2026-00117</span></td><td>Michelle Chen</td><td>Paterson, NJ</td><td><span class="chip green">Verified</span></td><td><span class="chip green">Linked</span></td><td><span class="chip green">Returned</span></td><td>$175,000</td><td>Aug 25</td><td>×</td></tr><tr><td><b>Broadway Holdings</b><br><span class="sub">QC-2026-00116</span></td><td>David Brown</td><td>Jersey City, NJ</td><td><span class="chip">Draft</span></td><td><span class="chip amber">Awaiting</span></td><td><span class="chip amber">Awaiting</span></td><td>$500,000</td><td>Aug 24</td><td>×</td></tr></tbody></table><div class="row" style="padding-top:13px"><span class="sub">1–3 of 3</span><span class="sp"></span><button class="btn">Previous</button><span>1 / 1</span><button class="btn">Next</button></div>`)}`);
  screens.new_application = shell(`<div class="workspace"><div class="workspaceHead"><b>Open application</b><span class="sp"></span><button class="iconbtn">−</button><button class="iconbtn">×</button></div><div class="workspaceBody"><div class="newgrid">${rail(1,true)}<div class="formcols"><section class="stack">${panel("The business",`<div class="fieldgrid">${field("Business name *","Alvarez Auto Group")}${field("Entity type *","Limited liability company")}</div><div style="margin-top:12px">${field("Industry and NAICS activity","441120 · Used car dealers")}</div><div class="fieldgrid" style="margin-top:12px">${field("Phone (optional)","(555) 010-2288")}${field("Email (optional)","finance@alvarezauto.com")}</div>`)}${panel("Where they are",`<div>${field("Search business address (optional)","80 Market Street, Newark, NJ 07102")}</div>`)}</section><aside class="stack">${panel("What they are after",`${field("Amount requested *","$350,000")}<div style="margin-top:12px">${field("Purpose *","Working capital")}</div><div style="margin-top:12px">${field("Use of funds, in writing *","Acquire inventory and refinance one existing business obligation.")}</div>`)}${panel("Notes from the visit",field("Internal note","Met both owners; follow up after statements arrive."))}<div class="footerAction"><button class="btn">Cancel</button><span class="sp"></span><button class="btn primary">Open the application</button></div></aside></div></div></div></div>`,"Portfolio");
  screens.step1 = appScreen(1,`${panel("Step 1 · Applicant entity",`<div class="fieldgrid three">${field("Legal entity name","Alvarez Auto Group")}${field("Entity type","LLC")}${field("EIN (optional)","Awaiting")}</div><div class="fieldgrid" style="margin-top:12px">${field("Industry and NAICS activity","441120 · Used car dealers")}${field("Business address","80 Market Street, Newark, NJ")}</div>`,"<span class='chip green'>Complete</span>")}${panel("Business ownership",`<div class="row"><b>100.00% allocated</b><span class="sp"></span><button class="btn">+ Add owner</button></div><div style="margin:12px -15px -15px">${ownerTable}</div>`,"<span class='chip green'>Complete</span>")}${panel("Facility request",`<div class="fieldgrid">${field("Amount requested","$350,000")}${field("Purpose","Working capital")}</div><div style="margin-top:12px">${field("Detailed use of funds","Acquire inventory and refinance one existing business obligation.")}</div>`)}<div class="footerAction"><span>All required information and owner screening are complete.</span><span class="sp"></span><button class="btn primary">Continue to Step 2</button></div>`);
  screens.eligibility = appScreen(1,`${panel("Step 1 · Applicant intake",`<div class="notice"><b>Ownership is complete.</b> Every 20%+ owner must finish the self-reported eligibility checkpoint.</div><div style="margin-top:12px">${ownerTable}</div>`)}`)+`<div class="modalShade"><section class="modal"><div class="panel-h"><b>Owner eligibility · Jordan Alvarez</b><span class="sp"></span><button class="iconbtn">×</button></div><div class="panel-b stack"><div class="warning"><b>Self-reported and unverified.</b> These answers route programs preliminarily and never replace credit or bank verification.</div><div class="eligList"><div class="eligQ"><div><b>Is this owner a U.S. citizen or legal permanent resident?</b><span>Select Yes or No. The exact status is recorded next.</span></div><div class="yn"><button class="on">Yes</button><button>No</button></div></div><div class="eligQ"><div><b>Is the owner's estimated credit at least 660?</b><span>iSoftPull verifies a tier later; do not enter a raw score.</span></div><div class="yn"><button class="on">Yes</button><button>No</button></div></div><div class="eligQ"><div><b>Has this owner ever filed for bankruptcy?</b><span>Timing is requested only after a Yes answer.</span></div><div class="yn"><button>Yes</button><button class="on">No</button></div></div><div class="eligQ"><div><b>Foreclosure within the past 3 years?</b><span>A disclosed event may block only one route.</span></div><div class="yn"><button>Yes</button><button class="on">No</button></div></div><div class="eligQ"><div><b>Will any portion of the proceeds refinance debt?</b><span>This is a file-level routing question.</span></div><div class="yn"><button class="on">Yes</button><button>No</button></div></div></div><div class="footerAction"><button class="btn">Back</button><span class="sp"></span><button class="btn primary">Save and continue</button></div></div></section></div>`;
  screens.step2 = appScreen(2,`${panel("Step 2 · Verification",`<div class="notice"><b>1 of 2 required owners completed.</b> Bank evidence and every required owner soft pull must return before Step 3 unlocks.</div>`,"<span class='chip amber'>In progress</span>")}${panel("Bank evidence",`<div class="row"><div class="docicon">▣</div><div><b>First National Bank · Primary operating</b><p class="sub">3 current statement months received · last sync Aug 26</p></div><span class="sp"></span><span class="chip green">Complete</span></div><div class="row" style="margin-top:12px"><button class="btn primary">Connect another bank</button><button class="btn">Upload bank statements</button><button class="btn">Request through file room</button></div>`)}${panel("Owner soft credit authorizations",`<div class="docrow"><div class="docicon">✓</div><div><b>Jordan Alvarez · 70%</b><p class="sub">j•••••@example.com · ••• ••• 2288</p></div><span class="chip green">Completed</span></div><div class="docrow"><div class="docicon">2</div><div><b>Sam Alvarez · 30%</b><p class="sub">s•••@example.com · ••• ••• 2940</p></div><span class="chip amber">Invitation sent</span></div><div class="row" style="margin-top:12px"><button class="btn primary">Send all pending authorizations</button><button class="btn">Copy secure link</button></div>`)}<div class="footerAction"><span>Waiting for Sam's soft pull. Official statements are complete.</span><span class="sp"></span><button class="btn" disabled>Continue to Step 3</button></div>`,false);
